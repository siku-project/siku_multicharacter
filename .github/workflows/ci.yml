name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: siku-project/siku_ci/actions/lua-syntax@v1

  manifest:
    name: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: siku-project/siku_ci/actions/manifest@v1

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Allow reading the private design system
        env:
          SIKU_UI_TOKEN: ${{ secrets.SIKU_UI_TOKEN }}
        run: |
          [ -n "$SIKU_UI_TOKEN" ] || { echo "::error::SIKU_UI_TOKEN secret is missing (read access to siku-project/siku-ui)."; exit 1; }
          git config --global url."https://x-access-token:${SIKU_UI_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
      - uses: siku-project/siku_ci/actions/web-checks@v1
        with:
          framework: svelte

  design-system:
    name: design-system
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Allow reading the private design system
        env:
          SIKU_UI_TOKEN: ${{ secrets.SIKU_UI_TOKEN }}
        run: |
          [ -n "$SIKU_UI_TOKEN" ] || { echo "::error::SIKU_UI_TOKEN secret is missing (read access to siku-project/siku-ui)."; exit 1; }
          git config --global url."https://x-access-token:${SIKU_UI_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
      - run: bun install --frozen-lockfile
      - run: bun run locales --check
      - run: bunx siku check src
      - run: bunx siku doctor .
      - run: bunx siku ai check ..

  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: siku-project/siku_ci/actions/branch-guard@v1
